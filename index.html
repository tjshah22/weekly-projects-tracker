<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fulfillment Weekly Tracker</title>
    <link rel="stylesheet" href="./styles.css?v=20260512-versant-inspired" />
  </head>
  <body>
    <div class="accent-strip" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <p id="sidebarEyebrow" class="eyebrow">Leadership Operations</p>
          <h1 id="sidebarTitle">Fulfillment Tracker</h1>
          <div class="sidebar-meta">
            <div>
              <span id="weekLabel">Week</span>
              <strong id="sidebarWeek">-</strong>
            </div>
            <div>
              <span id="sourceLabel">Source</span>
              <strong id="sidebarDeck">-</strong>
            </div>
          </div>
        </div>

        <nav class="view-nav" aria-label="Tracker views">
          <button class="nav-button active" data-view="projects">Projects</button>
          <button class="nav-button" data-view="highlights">Highlights</button>
          <button class="nav-button" data-view="metrics">Metrics</button>
          <button class="nav-button" data-view="jira">Jira</button>
        </nav>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2 id="workstreamsTitle">Workstreams</h2>
          </div>
          <div id="workstreamSummary" class="queue-summary"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2 id="statusTitle">Status Mix</h2>
          </div>
          <div id="statusSummary" class="status-summary"></div>
        </section>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p id="topbarEyebrow" class="eyebrow">Weekly Portfolio Review</p>
            <h2 id="topbarTitle">Fulfillment portfolio overview</h2>
          </div>
          <div class="topbar-actions">
            <a id="openBrief" class="button secondary" href="./outputs/leadership_brief.md">Leadership Brief</a>
            <button id="exportCsv" class="button secondary" type="button">Export CSV</button>
            <button id="openUpdateDialog" class="button primary" type="button">Add Update</button>
          </div>
        </header>

        <section class="hero-panel">
          <div id="metricsGrid" class="metrics-grid"></div>
          <div class="attention-panel">
            <div class="panel-header">
              <div>
                <p id="attentionEyebrow" class="eyebrow">Leadership</p>
                <h3 id="attentionTitle">Attention Queue</h3>
              </div>
              <span id="attentionCount" class="pill neutral">0</span>
            </div>
            <div id="attentionList" class="attention-list"></div>
          </div>
        </section>

        <section class="controls-panel">
          <div class="search-field">
            <span id="searchLabel">Search</span>
            <input id="searchInput" type="search" placeholder="Project, owner, workstream, risk" />
          </div>
          <label class="filter">
            <span id="workstreamFilterLabel">Workstream</span>
            <select id="workstreamFilter"></select>
          </label>
          <label class="filter">
            <span id="statusFilterLabel">Status</span>
            <select id="statusFilter"></select>
          </label>
          <label class="toggle-filter">
            <input id="attentionOnly" type="checkbox" />
            <span id="leadershipOnlyLabel">Leadership only</span>
          </label>
        </section>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-header">
              <div>
                <p id="mainEyebrow" class="eyebrow">Portfolio</p>
                <h3 id="mainTitle">Projects</h3>
              </div>
              <span id="resultCount" class="pill neutral">0</span>
            </div>
            <div id="primaryList" class="primary-list"></div>
          </div>

          <aside class="panel detail-panel">
            <div id="detailPane"></div>
          </aside>
        </section>
      </main>
    </div>

    <dialog id="updateDialog" class="dialog">
      <form id="updateForm" class="dialog-form" method="dialog">
        <div class="panel-header">
          <div>
            <p id="dialogEyebrow" class="eyebrow">Weekly Intake</p>
            <h3 id="dialogTitle">New project update</h3>
          </div>
          <button type="button" id="closeUpdateDialog" class="icon-button" aria-label="Close">x</button>
        </div>

        <div class="form-grid">
          <label>
            <span id="dialogWorkstreamLabel">Workstream</span>
            <select name="workstream" id="newWorkstream" required></select>
          </label>
          <label>
            <span id="dialogStatusLabel">Status</span>
            <select name="status" id="newStatus" required></select>
          </label>
        </div>

        <label>
          <span id="projectLabel">Project</span>
          <input type="text" name="project" required placeholder="CVP - USA Sports workflow" />
        </label>

        <div class="form-grid">
          <label>
            <span id="ownerLabel">Owner</span>
            <input type="text" name="owner" placeholder="Team lead" />
          </label>
          <label>
            <span id="targetDateLabel">Target date</span>
            <input type="text" name="targetDate" placeholder="5/15" />
          </label>
        </div>

        <label>
          <span id="updateLabel">This week update</span>
          <textarea name="update" rows="4" required placeholder="What changed this week?"></textarea>
        </label>

        <label>
          <span id="impactLabel">Business impact</span>
          <textarea name="impact" rows="3" placeholder="Why it matters for leadership"></textarea>
        </label>

        <label>
          <span id="riskLabel">Blocker or risk</span>
          <textarea name="risk" rows="3" placeholder="Dependency, decision, access issue, or timeline risk"></textarea>
        </label>

        <div class="form-grid">
          <label>
            <span id="askLabel">Leadership ask</span>
            <select name="ask" id="newAsk"></select>
          </label>
          <label>
            <span id="jiraLabel">Jira key or epic</span>
            <input type="text" name="jiraKey" placeholder="ABC-123" />
          </label>
        </div>

        <label>
          <span id="helpLabel">Help needed</span>
          <input type="text" name="help" placeholder="Decision, escalation, owner alignment" />
        </label>

        <div class="dialog-actions">
          <button type="button" id="cancelUpdateDialog" class="button secondary">Cancel</button>
          <button type="submit" class="button primary">Save update</button>
        </div>
      </form>
    </dialog>

    <script src="./config/tracker-config.js?v=20260512-versant-inspired"></script>
    <script src="./data/tracker-data.js?v=20260512-versant-inspired"></script>
    <script src="./app.js?v=20260512-versant-inspired"></script>
  </body>
</html>
